#  One thing to note: since wallust will overwrite the entire
#  config.yml, if you add other lazygit settings later (keybindings,
#  git options, etc.), add them to the template file at
#  .config/wallust/templates/colors-lazygit.yml rather than editing
#  config.yml directly.
# wallust template - colors-lazygit
gui:
  theme:
    activeBorderColor:
      - "#743844"
      - bold
    inactiveBorderColor:
      - "#9B9387"
    optionsTextColor:
      - "#743844"
    selectedLineBgColor:
      - "#9B9387"
    cherryPickedCommitBgColor:
      - "#5B323A"
    cherryPickedCommitFgColor:
      - "#EEE5DA"
    unstagedChangesColor:
      - "#252322"
    defaultFgColor:
      - "#EEE5DA"
    searchingActiveBorderColor:
      - "#62605E"
