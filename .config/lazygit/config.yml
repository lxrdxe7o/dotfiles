#  One thing to note: since wallust will overwrite the entire
#  config.yml, if you add other lazygit settings later (keybindings,
#  git options, etc.), add them to the template file at
#  .config/wallust/templates/colors-lazygit.yml rather than editing
#  config.yml directly.
# wallust template - colors-lazygit
gui:
  theme:
    activeBorderColor:
      - "#611A15"
      - bold
    inactiveBorderColor:
      - "#A79E91"
    optionsTextColor:
      - "#611A15"
    selectedLineBgColor:
      - "#A79E91"
    cherryPickedCommitBgColor:
      - "#611A15"
    cherryPickedCommitFgColor:
      - "#FAF1E4"
    unstagedChangesColor:
      - "#2B211F"
    defaultFgColor:
      - "#FAF1E4"
    searchingActiveBorderColor:
      - "#B8231D"
