#  One thing to note: since wallust will overwrite the entire
#  config.yml, if you add other lazygit settings later (keybindings,
#  git options, etc.), add them to the template file at
#  .config/wallust/templates/colors-lazygit.yml rather than editing
#  config.yml directly.
# wallust template - colors-lazygit
gui:
  theme:
    activeBorderColor:
      - "#6D6B8E"
      - bold
    inactiveBorderColor:
      - "#AA9A9B"
    optionsTextColor:
      - "#6D6B8E"
    selectedLineBgColor:
      - "#AA9A9B"
    cherryPickedCommitBgColor:
      - "#74616B"
    cherryPickedCommitFgColor:
      - "#FDEDEE"
    unstagedChangesColor:
      - "#2E293B"
    defaultFgColor:
      - "#FDEDEE"
    searchingActiveBorderColor:
      - "#B29195"
