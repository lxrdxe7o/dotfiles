# ========================
# TMUX CONFIGURATION
# ========================

# --- Default settings ---
set-option -g default-shell /usr/bin/fish
set -g @continuum-restore 'on' #auto-restore

# --- Prefix key ---
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# --- Mouse support ---
set -g mouse on

# --- Pane splitting ---
unbind '"'
unbind %
bind | split-window -h -c "$HOME"
bind - split-window -v -c "$HOME"

# --- Pane navigation (vim style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resize with Alt + Arrows ---
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# --- Window management ---
bind c new-window -c "$HOME"
bind , command-prompt -I "#W" "rename-window '%%'"
bind & kill-window
bind x kill-pane

# --- Session management ---
bind C-n new-session -c "$HOME"
bind C-l choose-session
bind R command-prompt -I "#S" "rename-session '%%'"
bind C-k confirm-before -p "Kill session #S? (y/n)" kill-session
bind C-a command-prompt -p "Attach to session:" "switch-client -t '%%'"
bind C-d detach-client

# --- Reload config quickly ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Reloaded!"

# ========================
# TMUX PLUGIN MANAGER (TPM)
# ========================
set -g @plugin 'tmux-plugins/tpm'              # TPM itself
#set -g @plugin 'tmux-plugins/tmux-sensible'    # sensible defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-yank'        # system clipboard support
set -g @plugin 'tmux-plugins/tmux-battery'     # battery indicator
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-restore (Should be at the end of the TPM list)

# Theme
set -g @plugin "https://gitlab.com/motaz-shokry/gruvbox-tmux"
set -g @gruvbox-tmux_theme "hard"  # medium | soft | Default is hard  
set -g @gruvbox-tmux_transparent 0   # 1 | 0
set -g @gruvbox-tmux_time_format 12H
set -g @gruvbox-tmux_show_battery_widget 1     # 0 to disable
set -g @gruvbox-tmux_battery_name "BAT0"       # run `ls /sys/class/power_supply` to know
set -g @gruvbox-tmux_battery_low_threshold 25 
set -g @gruvbox-tmux_terminal_icon 
set -g @gruvbox-tmux_active_terminal_icon 
set -g @gruvbox-tmux_window_id_style hsquare  # hsquare | fsquare | sub | super | arabic | earabic
set -g @gruvbox-tmux_pane_id_style fsquare # hsquare | fsquare | sub | super | arabic | earabic
set -g @gruvbox-tmux_zoom_id_style dsquare    # hsquare | fsquare | sub | super | arabic | earabic

# Use tmux’s modern terminfo (supports 256 + truecolor)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'

# Don’t override status bar or pane borders (inherit terminal colors)
#set -g status-style bg=default,fg=default
#set -g pane-border-style fg=default
#set -g pane-active-border-style fg=default
#set -g message-style bg=default,fg=default
#set -g mode-style bg=default,fg=default

# Optional: make inactive windows not force colors
#setw -g window-status-style bg=default,fg=default
#setw -g window-status-current-style bg=default,fg=default

# Initialize TPM (keep this at the bottom!)
run '~/.tmux/plugins/tpm/tpm'
