# ========================
# TMUX CONFIGURATION
# ========================

# --- Default settings ---
set-option -g default-shell /usr/bin/fish
set -g @continuum-restore 'on' #auto-restore

# --- Prefix key ---
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# --- Mouse support ---
set -g mouse on

# --- Copy mode: vim key bindings ---
setw -g mode-keys vi

# vim-style copy mode selection/yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi C-u send -X page-up
bind -T copy-mode-vi C-d send -X page-down

# --- Pane splitting ---
unbind '"'
unbind %
bind | split-window -h -c "$HOME"
bind - split-window -v -c "$HOME"

# --- Pane navigation (vim style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resize with Alt + Arrows ---
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# --- Window management ---
bind c new-window -c "$HOME"
bind , command-prompt -I "#W" "rename-window '%%'"
bind & kill-window
bind x kill-pane

# --- Session management ---
bind C-n new-session -c "$HOME"
bind C-l choose-session
bind R command-prompt -I "#S" "rename-session '%%'"
bind C-k confirm-before -p "Kill session #S? (y/n)" kill-session
bind C-a command-prompt -p "Attach to session:" "switch-client -t '%%'"
bind C-d detach-client

# --- Styled help screen ---
unbind ?
bind ? display-popup -h 70% -w 80% -E -T "  󰘞 TMUX KEY BINDINGS  " \
  "~/.config/tmux/scripts/help.sh | less -R 2>/dev/null || more"
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Reloaded!"

# ========================
# TMUX PLUGIN MANAGER (TPM)
# ========================
set -g @plugin 'tmux-plugins/tpm'              # TPM itself
#set -g @plugin 'tmux-plugins/tmux-sensible'    # sensible defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-yank'        # system clipboard support
set -g @plugin 'tmux-plugins/tmux-battery'     # battery indicator
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-restore (Should be at the end of the TPM list)

# Theme — tmux-gruvbox (actual TPM plugin)
set -g @plugin "https://gitlab.com/motaz-shokry/gruvbox-tmux"
set -g @tmux-gruvbox "dark256"           # dark256 | dark | light | light256
set -g @tmux-gruvbox-statusbar-alpha "true"  # transparent statusbar bg

# Use tmux’s modern terminfo (supports 256 + truecolor)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'

# Don’t override status bar or pane borders (inherit terminal colors)
#set -g status-style bg=default,fg=default
#set -g pane-border-style fg=default
#set -g pane-active-border-style fg=default
#set -g message-style bg=default,fg=default
#set -g mode-style bg=default,fg=default

# Optional: make inactive windows not force colors
#setw -g window-status-style bg=default,fg=default
#setw -g window-status-current-style bg=default,fg=default

# Initialize TPM (keep this at the bottom!)
run '~/.config/tmux/plugins/tpm/tpm'

# --- Custom Overrides ---
set -g pane-border-style fg='#282828'
set -g pane-active-border-style fg='#83a598'

# ========================
# STATUS BAR — Dark Material Gruvbox
# ========================

set -g status-style bg=default,fg=#ebdbb2

# --- status-left : session & pane info ---
set -g status-left \
"#[bg=#d65d0e,fg=#1d2021,bold]  󰮯  #S  \
#[bg=#3c3836,fg=#a89984,nobold]\
#[bg=#3c3836,fg=#ebdbb2]    #I:#P  \
#[bg=default,fg=#3c3836,nobold]"

# --- status-right : date, mode indicator, battery ---
set -g status-right-length 280
set -g status-right \
"#[bg=default,fg=#3c3836,nobold]\
#[bg=#3c3836,fg=#a89984]  󰃶  %Y-%m-%d    󰥔  %H:%M  \
#[bg=#3c3836]  #{tmux_mode_indicator}  \
#[bg=#8ec07c,fg=#1d2021,bold]    #(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh)  \
#[fg=#a89984,nobold]"

# --- Window status ---
set -g window-status-separator ''
set -g window-status-current-format \
"#[bg=#83a598,fg=#1d2021,bold]  󰮯  #I    #W  #{?window_zoomed_flag,󰊓,}  "
set -g window-status-format \
"#[bg=#282828,fg=#a89984]    #I    #W  "
set -g window-status-style bg=default,fg=#a89984

# --- Mode indicator prompts and glyphs ---
set -g @mode_indicator_empty_prompt " 󰊠 TMUX "
set -g @mode_indicator_empty_mode_style "bg=#ea6962,fg=#1d2021,bold"
set -g @mode_indicator_prefix_prompt " 󰘞 COMMAND "
set -g @mode_indicator_prefix_mode_style "bg=#cc241d,fg=#ebdbb2,bold"
set -g @mode_indicator_copy_prompt " 󰆏 COPY "
set -g @mode_indicator_copy_mode_style "bg=#d65d0e,fg=#1d2021,bold"
set -g @mode_indicator_sync_prompt "  SYNC "
set -g @mode_indicator_sync_mode_style "bg=#cc241d,fg=#ebdbb2,bold"

# Re-process mode_indicator
run '~/.config/tmux/plugins/tmux-mode-indicator/mode_indicator.tmux'
