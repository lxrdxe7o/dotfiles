<svg width="100%" height="80" viewBox="0 0 800 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.2); }
      }
      @keyframes bar-anim {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .footer-text {
        font-family: sans-serif;
        font-weight: bold;
        font-size: 20px;
        text-anchor: middle;
        fill: #e0e0e0;
        text-transform: uppercase;
        letter-spacing: 2px;
        filter: drop-shadow(0 0 2px #000);
      }
      .heart {
        fill: #8a0303;
        animation: pulse 1s infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="#050505" />
   <!-- Grid lines for consistency -->
   <path d="M0 0 L800 0 M0 40 L800 40 M0 80 L800 80" stroke="#1a1a1a" stroke-width="1" />
  
  <text x="400" y="48" class="footer-text">
    Made with <tspan class="heart">♥</tspan> by Xero
  </text>
  
    <!-- Decorative bars -->
  <rect x="0" y="75" width="800" height="5" fill="#1a1a1a" />
  <rect x="0" y="75" width="200" height="5" fill="url(#grad1)">
     <animateTransform attributeName="transform" type="translate" from="-200 0" to="800 0" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8a0303;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>

</svg>
